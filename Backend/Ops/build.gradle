plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'gj.cloud'
version = '0.0.1-SNAPSHOT'
description = 'Ops'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'com.github.mwiede:jsch:2.28.4'
    implementation 'org.yaml:snakeyaml'
    implementation 'com.nimbusds:nimbus-jose-jwt:10.0.2'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.84'
    implementation 'org.jsoup:jsoup:1.21.2'
    implementation 'com.openai:openai-java:4.43.0'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Auto Preview 배포 아티팩트가 포털 preview-runtime '실물' 소스를 그대로 번들하도록, 빌드 시 포털에서
// 필요한 파일만 리소스로 복사한다(preview-template/src/... 로 baked → 런타임에 classpath에서 읽어 emit).
// 이렇게 하면 배포 앱과 포털이 같은 컴포넌트를 쓰게 되어 '두 런타임 손수 동기화' 문제가 사라진다.
def portalDir = "${projectDir}/../../Frontend/portal"
def previewTemplateOut = layout.buildDirectory.dir("preview-template")
def blueprintManifestOut = layout.buildDirectory.dir("blueprint-manifest")

tasks.register('syncPreviewTemplate', Copy) {
    description = 'Copy portal preview-runtime sources into resources for the Auto Preview deployed artifact.'
    into previewTemplateOut.map { it.dir("preview-template/src") }
    // 포털 소스가 있을 때만 from을 건다. 컨텍스트에 Frontend가 없으면(예: Ops 단독 컨텍스트로 빌드) 존재하지
    // 않는 트리를 스냅샷하다 Gradle이 /proc까지 걷다 MD5 해시에 실패하는 문제가 있어, 없으면 조용히 no-op한다.
    // Docker 빌드는 리포 루트를 컨텍스트로 써서 아래 경로를 미러링(../../Frontend/portal)해 실제로 복사한다.
    if (file(portalDir).exists()) {
        from("${portalDir}/lib") {
            include 'types.ts'
            into 'lib'
        }
        from("${portalDir}/components/ui") {
            include 'cn.ts', 'button.tsx', 'field.tsx', 'loader.tsx', 'modal.tsx',
                    'panel.tsx', 'table.tsx', 'wizard.tsx', 'avatar.tsx', 'badge.tsx'
            into 'components/ui'
        }
        from("${portalDir}/components/preview-runtime") {
            exclude '**/README.md', '**/*.test.ts', '**/*.test.tsx'
            into 'components/preview-runtime'
        }
    } else {
        logger.warn("syncPreviewTemplate: 포털 소스({})가 없어 Auto Preview 템플릿 번들을 건너뜁니다.", portalDir)
    }
}

sourceSets.main.resources.srcDir previewTemplateOut

tasks.register('syncBlueprintManifest', Copy) {
    description = 'Copy the canonical Blueprint component manifest into Ops resources.'
    from("${portalDir}/components/preview-runtime/blueprints/manifests/component-manifest.json")
    into(blueprintManifestOut.map { it.dir("blueprint") })
}

sourceSets.main.resources.srcDir blueprintManifestOut
tasks.named('processResources') { dependsOn 'syncPreviewTemplate', 'syncBlueprintManifest' }
