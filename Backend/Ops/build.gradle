plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'gj.cloud'
version = '0.0.1-SNAPSHOT'
description = 'Ops'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'com.github.mwiede:jsch:2.28.4'
    implementation 'org.yaml:snakeyaml'
    implementation 'com.nimbusds:nimbus-jose-jwt:10.0.2'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.84'
    implementation 'com.openai:openai-java:4.43.0'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Auto Preview 배포 아티팩트가 포털 preview-runtime '실물' 소스를 그대로 번들하도록, 빌드 시 포털에서
// 필요한 파일만 리소스로 복사한다(preview-template/src/... 로 baked → 런타임에 classpath에서 읽어 emit).
// 이렇게 하면 배포 앱과 포털이 같은 컴포넌트를 쓰게 되어 '두 런타임 손수 동기화' 문제가 사라진다.
def portalDir = "${projectDir}/../../Frontend/portal"
def previewTemplateOut = layout.buildDirectory.dir("preview-template")

tasks.register('syncPreviewTemplate', Copy) {
    description = 'Copy portal preview-runtime sources into resources for the Auto Preview deployed artifact.'
    into previewTemplateOut.map { it.dir("preview-template/src") }
    from("${portalDir}/lib") {
        include 'types.ts'
        into 'lib'
    }
    from("${portalDir}/components/ui") {
        include 'cn.ts', 'button.tsx', 'field.tsx', 'loader.tsx', 'modal.tsx',
                'panel.tsx', 'table.tsx', 'wizard.tsx', 'avatar.tsx', 'badge.tsx'
        into 'components/ui'
    }
    from("${portalDir}/components/preview-runtime") {
        exclude '**/README.md', '**/*.test.ts', '**/*.test.tsx'
        into 'components/preview-runtime'
    }
}

sourceSets.main.resources.srcDir previewTemplateOut
tasks.named('processResources') { dependsOn 'syncPreviewTemplate' }
