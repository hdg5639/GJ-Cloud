spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      # 이 서비스엔 실제 Redis 리포지토리(@RedisHash)가 없어서, 리포지토리 스캔을 켜두면
      # JPA 리포지토리들을 대상으로 "store를 특정 못함" 경고만 반복 출력됨
      repositories:
        enabled: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: 8080

auth:
  server-url: ${AUTH_SERVER_URL}
  jwks-cache-ttl: 3600000
  service-client-id: ops-service
  service-client-secret: ${OPS_SERVICE_CLIENT_SECRET}

vm:
  service-url: ${VM_SERVICE_URL}

ai:
  api-key: ${OPENAI_API_KEY}
  model:
    standard: ${AI_MODEL_STANDARD:gpt-5.6-terra}
    escalated: ${AI_MODEL_ESCALATED:gpt-5.6-sol}

ops:
  management-key-encryption-secret: ${OPS_KEY_ENCRYPTION_SECRET}
  terminal-ticket-ttl-seconds: 30
  vm-ssh-username: ${VM_SSH_USERNAME:ubuntu}
  terminal-idle-timeout-minutes: 30
  allowed-origin: ${PORTAL_ORIGIN}
  file-browser-max-edit-size-bytes: ${OPS_FILE_BROWSER_MAX_EDIT_SIZE_BYTES:5242880}
  file-browser-max-upload-size-bytes: ${OPS_FILE_BROWSER_MAX_UPLOAD_SIZE_BYTES:26214400}
  deployment-lock-ttl-seconds: 1800
  deployment-executor:
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 20
  repo-analysis:
    clone-timeout-ms: 60000
    max-files: 2000
    max-depth: 12
    max-file-size-bytes: 1048576
    max-total-size-bytes: 52428800
  ai-generation-cache:
    ttl-seconds: 900
  blueprint-search:
    elasticsearch:
      enabled: ${BLUEPRINT_SEARCH_ENABLED:false}
      url: ${ELASTICSEARCH_URL:http://elasticsearch:9200}
      index: ${BLUEPRINT_SEARCH_INDEX:gamjabox-blueprints-v1}
      username: ${ELASTICSEARCH_USERNAME:}
      password: ${ELASTICSEARCH_PASSWORD:}
      reindex-on-startup: ${BLUEPRINT_SEARCH_REINDEX_ON_STARTUP:false}
  github:
    app-id: ${GITHUB_APP_ID}
    app-slug: ${GITHUB_APP_SLUG}
    client-id: ${GITHUB_APP_CLIENT_ID}
    client-secret: ${GITHUB_APP_CLIENT_SECRET}
    private-key: ${GITHUB_APP_PRIVATE_KEY}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
