services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: qwer1234
      MYSQL_DATABASE: auth-db
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pqwer1234"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loc-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loc-net

  auth:
    build: ./Backend/Auth
    image: gj-cloud-auth:latest
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://mysql:3306/auth-db?createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: qwer1234
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD:
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - loc-net

  user:
    build: ./Backend/User
    image: gj-cloud-user:latest
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://mysql:3306/user-db?createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: qwer1234
      AUTH_SERVER_URL: http://auth:8080
      PORT: 8080
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - loc-net

  swagger-ui:
    image: swaggerapi/swagger-ui
    environment:
      URLS: |
        [
          {"url":"/api-docs/auth","name":"Auth"},
          {"url":"/api-docs/user","name":"User"}
        ]
      # TODO: VM 서비스 추가 시 URLS에 아래 항목 추가
      # {"url":"/api-docs/vm","name":"VM"}
      BASE_URL: /
    networks:
      - loc-net

  swagger-proxy:
    image: nginx:alpine
    container_name: swagger-proxy
    ports:
      - "9000:80"
    volumes:
      - ./nginx/swagger.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - swagger-ui
      - auth
      - user
    networks:
      - loc-net

networks:
  loc-net:
    external: true
