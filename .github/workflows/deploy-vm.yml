name: Deploy Vm to ops-01

on:
  push:
    branches: [develop]
    paths:
      - 'Backend/vm/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Dev VM
    runs-on:
      - self-hosted
      - Linux
      - X64
      - gamjabox-dev
    steps:
      - name: Pull latest code in production directory
        run: |
          cd ~/GJ-Cloud
          git fetch origin develop
          git reset --hard origin/develop

      # CICD-001: 이전에는 --rmi local로 직전 이미지를 즉시 삭제해, 빌드/기동 후 헬스체크가 실패해도
      # 되돌아갈 이미지 자체가 없었음. 승인 게이트는 추가하지 않되(1인 프로젝트, 매 배포 수동 승인은
      # 속도만 늦춤), 이전 이미지를 보존해뒀다가 헬스체크 실패 시 자동으로 재태깅+재기동한다.
      - name: Build and deploy with health check + auto-rollback
        run: |
          set -e
          SERVICE=vm
          IMAGE=gj-cloud-${SERVICE}:latest
          HEALTH_PATH=/actuator/health

          PREV_IMAGE_ID=$(docker images -q "$IMAGE" | head -n1)

          docker compose build "$SERVICE"
          docker compose up -d "$SERVICE"

          # CICD-002: docker compose port + cut으로 호스트에 매핑된 포트를 알아내 localhost로
          # curl했는데, 앱은 매번 로그상 정상 기동되는데도 헬스체크가 매번 실패해 롤백당했다
          # (compose.yaml은 gitignore돼 있어 직접 확인은 못했지만, 호스트에 포트가 publish 안
          # 돼 있으면 HOST_PORT가 비어 애초에 curl 대상 자체가 잘못되는 것으로 강하게 의심됨).
          # 호스트 포트 publish 여부와 무관하게 항상 맞는 컨테이너 내부 IP:8080으로 직접 확인한다.
          CONTAINER_ID=$(docker compose ps -q "$SERVICE")
          CONTAINER_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$CONTAINER_ID")
          echo "헬스체크 대상: http://${CONTAINER_IP}:8080${HEALTH_PATH}"

          HEALTHY=0
          # vm은 R2DBC+Redis+WebClient까지 초기화하는 리액티브 앱이라 콜드 스타트가
          # 30초(10회x3초) 창에 걸치는 경계값 근처였고, 실제로 이 타이밍 때문에 정상
          # 이미지가 헬스체크 실패로 오판돼 롤백당한 적이 있어 100초로 넉넉하게 늘림.
          for i in $(seq 1 20); do
            sleep 5
            if curl -fsS "http://${CONTAINER_IP}:8080${HEALTH_PATH}" > /dev/null 2>&1; then
              HEALTHY=1
              break
            fi
          done

          if [ "$HEALTHY" = "1" ]; then
            echo "헬스체크 통과 — 배포 완료"
            exit 0
          fi

          echo "헬스체크 실패 — 이전 이미지로 롤백 시도"
          if [ -n "$PREV_IMAGE_ID" ]; then
            docker tag "$PREV_IMAGE_ID" "$IMAGE"
            docker compose up -d "$SERVICE"
          else
            echo "롤백할 이전 이미지가 없음(최초 배포)"
          fi
          exit 1
