name: Deploy landing page to ops-01

on:
  push:
    branches: [develop]
    paths:
      - 'gamjabox-landing/**'

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code in production directory
        run: |
          cd ~/GJ-Cloud
          git fetch origin develop
          git reset --hard origin/develop

      # 정적 파일이라 빌드/헬스체크 없이 Caddy가 새 파일을 읽도록 재시작만 하면 됨.
      # Caddy도 compose로 떠 있으므로 systemctl이 아닌 docker compose restart 사용.
      - name: Restart Caddy
        run: |
          cd ~/GJ-Cloud
          docker compose restart caddy
