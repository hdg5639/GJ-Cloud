name: Deploy static sites to dev-01

on:
  push:
    branches: [develop]
    paths:
      - 'gamjabox-landing/**'
      - 'api-docs-ui/**'
      - 'compose.yaml'
      - '.github/workflows/deploy-landing.yml'

concurrency:
  group: deploy-landing-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Dev VM
    timeout-minutes: 10
    runs-on:
      - self-hosted
      - Linux
      - X64
      - gamjabox-dev
    defaults:
      run:
        working-directory: /home/ubuntu/GJ-Cloud
    steps:
      - name: Pull latest code in production directory
        run: |
          git fetch origin develop
          git reset --hard origin/develop

      # 정적 파일은 bind mount로 바로 읽는다. compose에 새 정적 경로가 추가된 경우에도
      # mount가 갱신되도록 restart가 아니라 Caddy 컨테이너를 재생성한다.
      - name: Recreate Caddy
        run: docker compose up -d --force-recreate caddy
