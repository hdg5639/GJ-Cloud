name: Deploy Vm to ops-01

on:
  push:
    branches: [main]
    paths:
      - 'Backend/Vm/**'
  workflow_dispatch:

concurrency:
  group: deploy-vm-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production VM
    timeout-minutes: 30
    runs-on:
      - self-hosted
      - Linux
      - X64
      - gamjabox-prod
    defaults:
      run:
        working-directory: /home/ubuntu/GJ-Cloud
    steps:
      - name: Pull main code in production directory
        run: |
          git fetch origin main
          git reset --hard origin/main

      # CICD-001: 직전 이미지를 보존하고 새 이미지의 헬스체크가 실패하면 자동으로 롤백한다.
      - name: Build and deploy with health check + auto-rollback
        run: |
          set -e
          SERVICE=vm
          IMAGE=gj-cloud-${SERVICE}:latest
          HEALTH_PATH=/actuator/health

          PREV_IMAGE_ID=$(docker images -q "$IMAGE" | head -n1)

          docker compose build "$SERVICE"
          docker compose up -d "$SERVICE"

          # 호스트 포트 publish 여부와 무관하게 컨테이너 내부 IP로 헬스체크한다.
          CONTAINER_ID=$(docker compose ps -q "$SERVICE")
          CONTAINER_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$CONTAINER_ID")
          echo "헬스체크 대상: http://${CONTAINER_IP}:8080${HEALTH_PATH}"

          HEALTHY=0
          # VM 서비스의 리액티브 의존성 초기화 시간을 고려해 최대 100초간 확인한다.
          for i in $(seq 1 20); do
            sleep 5
            if curl -fsS "http://${CONTAINER_IP}:8080${HEALTH_PATH}" > /dev/null 2>&1; then
              HEALTHY=1
              break
            fi
          done

          if [ "$HEALTHY" = "1" ]; then
            echo "헬스체크 통과 — 배포 완료"
            exit 0
          fi

          echo "헬스체크 실패 — 이전 이미지로 롤백 시도"
          if [ -n "$PREV_IMAGE_ID" ]; then
            docker tag "$PREV_IMAGE_ID" "$IMAGE"
            docker compose up -d "$SERVICE"
          else
            echo "롤백할 이전 이미지가 없음(최초 배포)"
          fi
          exit 1
