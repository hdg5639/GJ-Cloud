name: Deploy portal to ops-01

on:
  push:
    branches: [develop]
    paths:
      - 'Frontend/portal/**'

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code in production directory
        run: |
          cd ~/GJ-Cloud
          git fetch origin develop
          git reset --hard origin/develop

      - name: Build and deploy
        run: |
          docker compose down portal --rmi local
          docker compose up portal -d --build
