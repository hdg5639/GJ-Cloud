<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">ControlBox symbol</title>
  <desc id="desc">A GamjaBox-family potato cloud symbol with control sliders for the admin console.</desc>
  <defs>
    <linearGradient id="shell" x1="18" y1="13" x2="80" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#23342A"/>
      <stop offset=".52" stop-color="#17211B"/>
      <stop offset="1" stop-color="#0E1712"/>
    </linearGradient>
    <linearGradient id="panel" x1="29" y1="27" x2="69" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1EDB78"/>
      <stop offset=".52" stop-color="#08B85B"/>
      <stop offset="1" stop-color="#078C47"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#06150D" flood-opacity=".23"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <path
      d="M25.7 16.1C36.4 8.7 55.2 8.1 68.6 14.5C82.3 21.1 90.1 36.6 88.2 52.4C86.3 68.3 76.5 83.1 60.9 87.7C45.4 92.3 28.6 87.2 19.6 74.8C10.5 62.4 9.7 43.7 16.4 29.7C18.9 24.4 22 18.7 25.7 16.1Z"
      fill="url(#shell)"
    />

    <path d="M28.5 24.5C37 18.9 50.7 18 61.5 21.8" fill="none" stroke="white" stroke-opacity=".12" stroke-width="5.5" stroke-linecap="round"/>

    <circle cx="25.5" cy="46.5" r="2.7" fill="#07100B" opacity=".32"/>
    <circle cx="68" cy="30.5" r="2.3" fill="#07100B" opacity=".28"/>
    <circle cx="71" cy="67" r="3" fill="#07100B" opacity=".25"/>
    <circle cx="37" cy="75" r="2.2" fill="#07100B" opacity=".22"/>

    <rect x="27" y="27" width="42" height="42" rx="12" fill="white"/>
    <rect x="32" y="32" width="32" height="32" rx="9" fill="url(#panel)"/>

    <path d="M39 40H57" stroke="white" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="46" cy="40" r="4.2" fill="white"/>
    <circle cx="46" cy="40" r="1.7" fill="#078C47"/>

    <path d="M39 48H57" stroke="white" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="53" cy="48" r="4.2" fill="white"/>
    <circle cx="53" cy="48" r="1.7" fill="#078C47"/>

    <path d="M39 56H57" stroke="white" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="43" cy="56" r="4.2" fill="white"/>
    <circle cx="43" cy="56" r="1.7" fill="#078C47"/>
  </g>
</svg>