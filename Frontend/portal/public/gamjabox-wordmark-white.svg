<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 96" role="img" aria-labelledby="title">
  <title id="title">GamjaBox monochrome wordmark</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@800&amp;display=swap');
    .brand-name { font-family: Manrope, Inter, Arial, sans-serif; font-size: 58px; font-weight: 800; letter-spacing: -3.1px; }
    .wm-symbol{transform-origin:49px 49px;opacity:0;animation:wmSymbolIn .62s cubic-bezier(.34,1.56,.64,1) .05s both}
    .wm-name{opacity:0;animation:wmSlideIn .5s cubic-bezier(.16,1,.3,1) .34s both}
    @keyframes wmSymbolIn{0%{opacity:0;transform:scale(.55) rotate(-8deg)}60%{opacity:1;transform:scale(1.07) rotate(1deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
    @keyframes wmSlideIn{0%{opacity:0;transform:translateX(-10px)}100%{opacity:1;transform:translateX(0)}}
    @media (prefers-reduced-motion:reduce){.wm-symbol,.wm-name{animation:none!important;opacity:1!important}}
  </style>
  <g class="wm-symbol">
    <g transform="translate(5.3 7.6) scale(2.3)">
      <path fill="#FFFFFF" d="M19 2.5 32.8 10v16L19 33.5 5.2 26V10L19 2.5Z"/>
      <path fill="#07100a" d="M12.2 13.2h13.6v3.1H16v5.4h6.6v-2.1h-3v-2.8h6.2v7.8c-1.7 1.2-4 1.9-6.8 1.9-5.2 0-8.8-3-8.8-7.7 0-2.2.7-4.1 2-5.6Z"/>
    </g>
  </g>
  <text x="100" y="67" class="brand-name wm-name" fill="#FFFFFF">GamjaBox</text>
</svg>