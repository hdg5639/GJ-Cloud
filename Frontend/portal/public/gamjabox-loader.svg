<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 38 38" role="img" aria-labelledby="title desc">
  <title id="title">GamjaBox loading</title>
  <desc id="desc">The GamjaBox hexagon mark appears, then its G glyph draws in counter-clockwise and unwinds again.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8ff58"/>
      <stop offset="1" stop-color="#62ffa8"/>
    </linearGradient>
    <style>
      .loader-hex {
        transform-origin: 19px 18px;
        opacity: 1;
        transform: scale(1);
        animation: hexPop 2.4s cubic-bezier(.65,0,.35,1) infinite;
      }
      .loader-g {
        fill: none;
        stroke: #07100a;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 100;
        stroke-dashoffset: 0;
        animation: gDraw 2.4s cubic-bezier(.65,0,.35,1) infinite;
      }
      @keyframes hexPop {
        0% { opacity: 0; transform: scale(.82); }
        8% { opacity: 1; transform: scale(1); }
        92% { opacity: 1; transform: scale(1); }
        100% { opacity: 0; transform: scale(.82); }
      }
      @keyframes gDraw {
        0%, 10% { stroke-dashoffset: 100; }
        50% { stroke-dashoffset: 0; }
        90%, 100% { stroke-dashoffset: 100; }
      }
      @media (prefers-reduced-motion: reduce) {
        .loader-hex, .loader-g { animation: none !important; opacity: 1 !important; transform: none !important; stroke-dashoffset: 0 !important; }
      }
    </style>
  </defs>
  <path class="loader-hex" fill="url(#g)" d="M19 2.5 32.8 10v16L19 33.5 5.2 26V10L19 2.5Z"/>
  <path class="loader-g" pathLength="100" d="M12.2,13.2 C10.9,14.7 10.2,16.6 10.2,18.8 C10.2,23.5 13.8,26.5 19,26.5 C21.8,26.5 24.1,25.8 25.8,24.6 L25.8,16.8 L19.6,16.8 L19.6,19.6 L22.6,19.6 L22.6,21.7 L16,21.7 L16,16.3 L25.8,16.3 L25.8,13.2 Z"/>
</svg>
