<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GamjaBox loading</title>
  <desc id="desc">A potato-shaped cloud core with orbiting server blocks.</desc>
  <defs>
    <linearGradient id="potatoGradient" x1="42" y1="35" x2="134" y2="142" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1EDB78"/><stop offset="0.48" stop-color="#08B85B"/><stop offset="1" stop-color="#078E48"/>
    </linearGradient>
    <linearGradient id="shineGradient" x1="55" y1="48" x2="112" y2="126" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.46"/><stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#087C43" flood-opacity="0.22"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <style>
    .loader-root{transform-origin:90px 90px;animation:rootFloat 2.8s ease-in-out infinite}
    .orbit-ring{stroke-dasharray:4 10;animation:ringSpin 7s linear infinite;transform-origin:90px 90px}
    .potato{transform-origin:90px 92px;animation:potatoPulse 1.8s cubic-bezier(.4,0,.2,1) infinite}
    .core-g{transform-origin:90px 91px;animation:corePulse 1.8s cubic-bezier(.4,0,.2,1) infinite}
    .orbit-item{animation:orbit 3.3s linear infinite}.orbit-item.secondary{animation-delay:-1.65s}
    .spark{opacity:0;animation:spark 1.8s ease-in-out infinite}.s2{animation-delay:.35s}.s3{animation-delay:.7s}.s4{animation-delay:1.05s}
    .status-dot{animation:statusBlink 1.2s ease-in-out infinite}
    @keyframes rootFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes ringSpin{to{transform:rotate(360deg)}}
    @keyframes potatoPulse{0%,100%{transform:scale(1) rotate(0)}35%{transform:scale(1.035,.97) rotate(-1deg)}65%{transform:scale(.985,1.025) rotate(1deg)}}
    @keyframes corePulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.06);opacity:.92}}
    @keyframes orbit{from{offset-distance:0%}to{offset-distance:100%}}
    @keyframes spark{0%,15%,100%{opacity:0;transform:scale(.4)}45%{opacity:1;transform:scale(1)}70%{opacity:0;transform:scale(1.5)}}
    @keyframes statusBlink{0%,100%{opacity:.35}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.loader-root,.orbit-ring,.potato,.core-g,.orbit-item,.spark,.status-dot{animation:none!important}}
  </style>
  <g class="loader-root">
    <ellipse cx="90" cy="153" rx="38" ry="7" fill="#0B8F4A" opacity="0.08"/>
    <circle cx="90" cy="90" r="64" stroke="#08B85B" stroke-opacity="0.10" stroke-width="1.5"/>
    <circle class="orbit-ring" cx="90" cy="90" r="58" stroke="#08B85B" stroke-opacity="0.28" stroke-width="2" stroke-linecap="round"/>
    <g class="orbit-item" style="offset-path:path('M31 90C31 50.8 56.9 25 90 25C123.1 25 149 50.8 149 90C149 129.2 123.1 155 90 155C56.9 155 31 129.2 31 90Z')">
      <g transform="translate(-12 -10)"><rect width="24" height="20" rx="6" fill="white" stroke="#08B85B" stroke-width="2"/><rect x="5" y="5" width="14" height="3" rx="1.5" fill="#08B85B" opacity=".85"/><rect x="5" y="11" width="9" height="3" rx="1.5" fill="#A7E8C4"/><circle class="status-dot" cx="18" cy="12.5" r="1.7" fill="#08B85B"/></g>
    </g>
    <g class="orbit-item secondary" style="offset-path:path('M31 90C31 50.8 56.9 25 90 25C123.1 25 149 50.8 149 90C149 129.2 123.1 155 90 155C56.9 155 31 129.2 31 90Z')">
      <g transform="translate(-9 -9)"><rect width="18" height="18" rx="5" fill="#08B85B"/><path d="M5.5 6.2H12.5M5.5 9H10.8M5.5 11.8H12.5" stroke="white" stroke-width="1.7" stroke-linecap="round"/></g>
    </g>
    <path d="M58.4 43.6C71.5 34.2 95.7 33.2 113.5 41.9C132 51 143.3 71.8 140.8 92.9C138.3 114 125.1 135.4 104.1 142.2C83.2 149 59.7 141.7 47.3 124.7C34.9 107.8 33.7 81.1 43.7 61.3C47.6 53.6 52.5 47.9 58.4 43.6Z" fill="#08B85B" opacity=".18" filter="url(#glow)"/>
    <g class="potato" filter="url(#softShadow)">
      <path d="M58.4 43.6C71.5 34.2 95.7 33.2 113.5 41.9C132 51 143.3 71.8 140.8 92.9C138.3 114 125.1 135.4 104.1 142.2C83.2 149 59.7 141.7 47.3 124.7C34.9 107.8 33.7 81.1 43.7 61.3C47.6 53.6 52.5 47.9 58.4 43.6Z" fill="url(#potatoGradient)"/>
      <path d="M62 49C74.8 40.9 94.7 40.6 109 47.4C120.3 52.8 129.5 63.3 133 75.6" stroke="url(#shineGradient)" stroke-width="8" stroke-linecap="round"/>
      <circle cx="61.5" cy="78.5" r="3.2" fill="#05733C" opacity=".32"/><circle cx="119.5" cy="68.5" r="2.7" fill="#05733C" opacity=".28"/><circle cx="122.5" cy="111.5" r="3.8" fill="#05733C" opacity=".25"/><circle cx="68.5" cy="120.5" r="2.7" fill="#05733C" opacity=".23"/>
      <g class="core-g"><path d="M107.5 77.5C103.5 69.8 96.7 66 88.2 66C74.5 66 64 76.7 64 91.1C64 105.5 74.4 116 88.8 116C102 116 111.7 107.4 112.7 94.5H90.7V84.5H124V90.2C124 111.2 109.7 126.5 88.5 126.5C66.6 126.5 52 111.1 52 91.1C52 71 67 55.5 88.4 55.5C103.4 55.5 115.2 62.7 121 74.2L107.5 77.5Z" fill="white"/><rect x="86" y="86" width="29" height="9" rx="4.5" fill="#DDF8E9"/></g>
    </g>
    <g class="spark" transform-origin="38px 58px"><path d="M38 51V65M31 58H45" stroke="#16C96C" stroke-width="2.5" stroke-linecap="round"/></g>
    <g class="spark s2" transform-origin="145px 52px"><path d="M145 47V57M140 52H150" stroke="#16C96C" stroke-width="2.2" stroke-linecap="round"/></g>
    <g class="spark s3" transform-origin="145px 128px"><path d="M145 123V133M140 128H150" stroke="#16C96C" stroke-width="2.2" stroke-linecap="round"/></g>
    <g class="spark s4" transform-origin="40px 127px"><circle cx="40" cy="127" r="3" fill="#16C96C"/></g>
  </g>
</svg>
