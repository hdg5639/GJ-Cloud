<svg xmlns="http://www.w3.org/2000/svg" width="900" height="910" viewBox="0 0 900 910" role="img" aria-labelledby="title desc">
<title id="title">GamjaBox 요청과 데이터 구조</title><desc id="desc">브라우저 요청은 Cloudflare Tunnel과 Caddy를 거쳐 화면과 네 백엔드로 분기된다. Auth와 User는 같은 MySQL 인스턴스의 별도 DB, VM과 Ops는 각각 PostgreSQL을 사용한다. Redis는 Auth, VM, Ops가 공유하고 User 이미지는 영속 볼륨에 저장한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526775"/></marker></defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif; fill: #182c36; }
.title { font-size: 30px; font-weight: 700; } .name { font-size: 23px; font-weight: 650; }
.body { font-size: 18px; } .small { font-size: 16px; fill: #4e626e; }
.label { font-size: 15px; font-weight: 650; fill: #32604c; letter-spacing: 1px; }
.line { fill: none; stroke: #526775; stroke-width: 2; marker-end: url(#arrow); }
.rule { stroke: #dce5e8; }
</style><rect width="900" height="910" rx="12" fill="#fafcfc"/>
<text x="36" y="35" class="label" text-anchor="start">GAMJABOX / 01</text>
<text x="36" y="74" class="title" text-anchor="start">요청이 들어오고, 데이터가 저장되는 곳</text>
<rect x="310" y="108" width="280" height="62" rx="8" fill="#ffffff" stroke="#bdcdd4" stroke-width="1.5"/>
<text x="450.0" y="139" class="name" text-anchor="middle">사용자 · 관리자 브라우저</text>
<path d="M 450 170 V 212" class="line"/>
<text x="468" y="197" class="small" text-anchor="start">HTTPS · SSE · WebSocket</text>
